services:
  db:
    image: ankane/pgvector:v0.5.1
    container_name: aicamera_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-face_rec_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-face_rec_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: aicamera_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=db
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-face_rec_db}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - ./storage:/app/storage

volumes:
  postgres_data:
